name: Build and upload Ember Todo to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ember-todo-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Verify Apple submission SDK minimum
        run: scripts/verify_submission_sdk.sh 26

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Set up code signing
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_APP_B64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_APP_B64" | base64 --decode > "$PROFILE_DIR/app.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          set -euo pipefail
          set -o pipefail
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project EmberTodo.xcodeproj \
            -scheme EmberTodo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ember-todo.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="1.0.0" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Show archive diagnostics
        if: failure()
        run: |
          grep -nE ': (error|warning): |ARCHIVE FAILED|The following build commands failed' "$RUNNER_TEMP/archive.log" | tail -100 || true

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>2M8US99596</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.peteradams.embertodo</key><string>Ember Todo App Store</string></dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ember-todo.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Verify IPA metadata
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          python3 scripts/verify_ipa.py "$IPA" \
            --bundle-id com.peteradams.embertodo --version 1.0.0 --build "$BUILD_NUMBER" \
            --minimum-os 17.0 --team-id 2M8US99596

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey '${{ secrets.ASC_KEY_ID }}' \
            --apiIssuer '${{ secrets.ASC_ISSUER_ID }}' \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Verify TestFlight processing and group
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_APP_ID: "6804744496"
          ASC_BETA_GROUP_ID: "3d5ddbd2-155d-440c-8946-49f7652d6e93"
          EVIDENCE_PATH: ${{ runner.temp }}/testflight-verification.txt
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet PyJWT cryptography
          ASC_KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "$RUNNER_TEMP/asc-venv/bin/python" scripts/verify_testflight.py

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-todo-testflight-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
            ${{ runner.temp }}/testflight-verification.txt
          if-no-files-found: warn

      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          find "$RUNNER_TEMP" -maxdepth 2 -type f \( -name '*.p8' -o -name '*.p12' -o -name '*.mobileprovision' \) -delete
          find "$HOME/.private_keys" -type f -name 'AuthKey_*.p8' -delete 2>/dev/null || true
