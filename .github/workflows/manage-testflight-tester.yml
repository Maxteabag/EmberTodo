name: Manage Ember Todo TestFlight tester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
      - name: Add and invite tester
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_APP_ID: "6804744496"
          ASC_BETA_GROUP_ID: "3d5ddbd2-155d-440c-8946-49f7652d6e93"
          TESTER_EMAIL: "peter.w.adams96@gmail.com"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet PyJWT cryptography
          ASC_KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "$RUNNER_TEMP/asc-venv/bin/python" scripts/manage_testflight_tester.py \
            2>&1 | tee "$RUNNER_TEMP/tester-evidence.txt"
      - name: Upload tester evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-todo-tester-${{ github.run_number }}
          path: ${{ runner.temp }}/tester-evidence.txt
          if-no-files-found: warn
      - name: Clean API key
        if: always()
        run: find "$HOME/.private_keys" -type f -name 'AuthKey_*.p8' -delete 2>/dev/null || true
