name: EmberTodo
options:
  bundleIdPrefix: com.peteradams
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "2M8US99596"
packages:
  TodoCore:
    path: .
targets:
  EmberTodo:
    type: application
    platform: iOS
    sources:
      - path: Sources/EmberTodo
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: TodoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peteradams.embertodo
        PRODUCT_NAME: Ember Todo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/EmberTodo/Resources/Info.plist
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "2M8US99596"
        PROVISIONING_PROFILE_SPECIFIER: "Ember Todo App Store"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  EmberTodo:
    build:
      targets:
        EmberTodo: all
    run:
      config: Debug
    archive:
      config: Release

